name: Build Mera AI v2.4 Memory Fix APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-meraai-v24.yml'
      - 'MeraAI-Android-v2.4-memory-fix.zip'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and validate v2.4 source
        shell: bash
        run: |
          set -euo pipefail
          test -f MeraAI-Android-v2.4-memory-fix.zip
          mkdir -p extracted
          unzip -q MeraAI-Android-v2.4-memory-fix.zip -d extracted
          test -f extracted/MeraAI-Android-v2.4-memory-fix/settings.gradle.kts
          python3 extracted/MeraAI-Android-v2.4-memory-fix/scripts/validate_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Android debug APK
        working-directory: extracted/MeraAI-Android-v2.4-memory-fix
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee build.log

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MeraAI-v24-Build-Log
          path: extracted/MeraAI-Android-v2.4-memory-fix/build.log
          if-no-files-found: ignore

      - name: Upload diagnostic APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MeraAI-v24-Memory-Fix-APK
          path: extracted/MeraAI-Android-v2.4-memory-fix/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
