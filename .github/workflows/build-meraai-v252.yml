name: Build Mera AI v2.5.2 Offline Test APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MeraAI-Android-v2.5.2-offline-fix.zip'
      - '.github/workflows/build-meraai-v252.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract and validate
        shell: bash
        run: |
          set -euo pipefail
          test -f MeraAI-Android-v2.5.2-offline-fix.zip
          mkdir -p extracted
          unzip -q MeraAI-Android-v2.5.2-offline-fix.zip -d extracted
          test -f extracted/MeraAI-Android-v2.5.2-offline-fix/settings.gradle.kts
          python3 extracted/MeraAI-Android-v2.5.2-offline-fix/scripts/validate_project.py
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: extracted/MeraAI-Android-v2.5.2-offline-fix
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee build.log
      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MeraAI-v252-build-log
          path: extracted/MeraAI-Android-v2.5.2-offline-fix/build.log
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MeraAI-v252-offline-test-APK
          path: extracted/MeraAI-Android-v2.5.2-offline-fix/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
