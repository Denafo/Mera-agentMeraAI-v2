name: Build Mera AI v2.5 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MeraAI-Android-v2.5-personal.zip'
      - '.github/workflows/build-meraai-v25.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and validate project
        shell: bash
        run: |
          set -euo pipefail
          test -f MeraAI-Android-v2.5-personal.zip
          mkdir -p extracted
          unzip -q MeraAI-Android-v2.5-personal.zip -d extracted
          test -f extracted/MeraAI-Android-v2.5-personal/settings.gradle.kts
          python3 extracted/MeraAI-Android-v2.5-personal/scripts/validate_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Android APK
        working-directory: extracted/MeraAI-Android-v2.5-personal
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee build.log

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MeraAI-v25-Build-Log
          path: extracted/MeraAI-Android-v2.5-personal/build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MeraAI-v25-Personal-APK
          path: extracted/MeraAI-Android-v2.5-personal/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
