name: Build Mera AI v2.6 Knowledge APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MeraAI-Android-v2.6-knowledge.zip'
      - '.github/workflows/build-meraai-v26.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract and validate source
        shell: bash
        run: |
          set -euo pipefail
          test -f MeraAI-Android-v2.6-knowledge.zip
          mkdir -p extracted
          unzip -q MeraAI-Android-v2.6-knowledge.zip -d extracted
          test -f extracted/MeraAI-Android-v2.6-knowledge/settings.gradle.kts
          python3 extracted/MeraAI-Android-v2.6-knowledge/scripts/validate_project.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile APK
        working-directory: extracted/MeraAI-Android-v2.6-knowledge
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee build.log
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MeraAI-v26-Build-Log
          path: extracted/MeraAI-Android-v2.6-knowledge/build.log
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MeraAI-v26-Knowledge-APK
          path: extracted/MeraAI-Android-v2.6-knowledge/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
